<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuantum Lab — AI Learning Path — Markdown Viewer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
    --bg:#1e1e1e; --bg-side:#252526; --bg-tabs:#2d2d2d; --bg-editor:#1e1e1e;
    --fg:#d4d4d4; --fg-dim:#858585; --fg-bright:#ffffff;
    --accent:#3794ff; --accent-dim:#264f78;
    --border:#3c3c3c; --border-bright:#4b4b4b;
    --md-blue:#569cd6; --md-green:#6a9955; --md-orange:#ce723b;
    --tab-active:#1e1e1e; --status:#007acc;
    --sel:rgba(55,148,255,.18);
}
html, body { height:100%; }
body {
    background:var(--bg); color:var(--fg);
    font-family:'Inter', sans-serif; font-size:14.5px;
    display:flex; flex-direction:column; overflow:hidden;
}
/* ===== TITLE BAR ===== */
.titlebar {
    height:36px; background:var(--bg-side); border-bottom:1px solid var(--border);
    display:flex; align-items:center; padding:0 1rem; gap:.75rem; flex-shrink:0;
    font-size:.8rem; color:var(--fg-dim);
}
.titlebar .win-dots { display:flex; gap:.4rem; }
.titlebar .win-dots span { width:12px; height:12px; border-radius:50%; }
.titlebar .win-dots .r { background:#ff5f57; } .titlebar .win-dots .y { background:#febc2e; } .titlebar .win-dots .g { background:#28c840; }
.titlebar .title-text { flex:1; text-align:center; font-size:.78rem; }
.titlebar .title-text .file { color:var(--fg); }
/* ===== BODY ===== */
.workbench { display:flex; flex:1; overflow:hidden; }
/* ===== SIDEBAR ===== */
.sidebar {
    width:240px; background:var(--bg-side); border-right:1px solid var(--border);
    display:flex; flex-direction:column; flex-shrink:0; overflow:hidden;
}
.sidebar-header {
    padding:.9rem 1rem .6rem; font-size:.7rem; font-weight:600; letter-spacing:1.2px;
    text-transform:uppercase; color:var(--fg-dim);
}
.sidebar-tree { flex:1; overflow-y:auto; padding:.25rem .5rem 1rem; }
.tree-folder {
    display:flex; align-items:center; gap:.45rem; padding:.35rem .4rem;
    color:var(--fg); font-size:.85rem; cursor:pointer; border-radius:4px; font-weight:500;
}
.tree-folder:hover { background:rgba(255,255,255,.05); }
.tree-folder .chev { color:var(--fg-dim); font-size:.65rem; transition:transform .15s; }
.tree-folder.open .chev { transform:rotate(90deg); }
.tree-folder .icon { color:var(--md-orange); font-size:.95rem; }
.tree-files { display:none; }
.tree-files.show { display:block; }
.tree-file {
    display:flex; align-items:center; gap:.45rem; padding:.3rem .4rem .3rem 1.5rem;
    font-size:.83rem; color:var(--fg); cursor:pointer; border-radius:4px; font-family:'JetBrains Mono',monospace; font-size:.8rem;
}
.tree-file:hover { background:rgba(255,255,255,.06); }
.tree-file.active { background:var(--accent-dim); color:var(--fg-bright); position:relative; }
.tree-file.active::before { content:''; position:absolute; left:0; top:0; bottom:0; width:2px; background:var(--accent); }
.tree-file .ficon { color:var(--md-blue); font-size:.8rem; }
.sidebar-footer {
    padding:.7rem 1rem; border-top:1px solid var(--border); font-size:.72rem; color:var(--fg-dim);
    font-family:'JetBrains Mono',monospace;
}
.sidebar-footer .row { display:flex; justify-content:space-between; margin:.15rem 0; }
/* ===== MAIN ===== */
.main-area { flex:1; display:flex; flex-direction:column; overflow:hidden; }
/* tabs */
.tabs-bar {
    background:var(--bg-tabs); display:flex; align-items:stretch; overflow-x:auto; flex-shrink:0;
    border-bottom:1px solid var(--border); scrollbar-width:thin;
}
.tab {
    display:flex; align-items:center; gap:.55rem; padding:0 .9rem; height:38px;
    background:transparent; border-right:1px solid var(--border); cursor:pointer;
    font-family:'JetBrains Mono',monospace; font-size:.8rem; color:var(--fg-dim);
    white-space:nowrap; position:relative; flex-shrink:0;
}
.tab .ficon { color:var(--md-blue); }
.tab:hover { color:var(--fg); background:rgba(255,255,255,.03); }
.tab.active { background:var(--tab-active); color:var(--fg-bright); border-top:1px solid var(--accent); }
.tab .close-x { display:flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:4px; color:var(--fg-dim); font-size:1rem; }
.tab .close-x:hover { background:rgba(255,255,255,.12); color:var(--fg-bright); }
/* breadcrumb */
.breadcrumb {
    padding:.5rem 1.5rem; font-size:.75rem; color:var(--fg-dim); border-bottom:1px solid var(--border);
    background:var(--bg-editor); font-family:'JetBrains Mono',monospace; flex-shrink:0;
}
.breadcrumb a { color:var(--fg-dim); text-decoration:none; } .breadcrumb a:hover { color:var(--accent); }
.breadcrumb .sep { opacity:.5; margin:0 .3rem; }
.breadcrumb .cur { color:var(--fg); }
/* editor */
.editor-scroll { flex:1; overflow-y:auto; background:var(--bg-editor); }
.editor-layout { display:grid; grid-template-columns:52px 1fr; min-height:100%; }
.gutter {
    padding:1.5rem .5rem 3rem; text-align:right; color:var(--fg-dim); font-family:'JetBrains Mono',monospace;
    font-size:.78rem; line-height:1.75; user-select:none; opacity:.55; background:var(--bg-editor);
    position:sticky; top:0; height:fit-content;
}
.code-area { padding:1.5rem 3.5rem 4rem; max-width:1020px; }
/* markdown render */
.md h1 { font-size:2rem; font-weight:600; color:var(--fg-bright); margin:2.5rem 0 1rem; border-bottom:1px solid var(--border); padding-bottom:.5rem; }
.md h2 { font-size:1.5rem; font-weight:600; color:var(--fg-bright); margin:2.25rem 0 .9rem; }
.md h3 { font-size:1.15rem; font-weight:600; color:var(--fg-bright); margin:1.75rem 0 .75rem; }
.md h3::before { content:'# '; color:var(--md-green); font-family:'JetBrains Mono',monospace; font-weight:400; }
.md h4 { font-size:1rem; color:var(--fg); margin:1.4rem 0 .5rem; font-weight:600; }
.md p { color:var(--fg); margin:1rem 0; line-height:1.75; }
.md strong { color:var(--fg-bright); }
.md a { color:var(--accent); text-decoration:none; } .md a:hover { text-decoration:underline; }
.md ul, .md ol { margin:1rem 0 1rem .25rem; padding-left:1.5rem; }
.md ul li { list-style:none; position:relative; margin:.5rem 0; padding-left:1.2rem; color:var(--fg); }
.md ul li::before { content:'-'; position:absolute; left:0; color:var(--md-green); font-family:'JetBrains Mono',monospace; }
.md ol li { margin:.5rem 0; color:var(--fg); }
.md blockquote { border-left:3px solid var(--md-green); background:rgba(106,153,85,.08); padding:.85rem 1.25rem; margin:1.5rem 0; border-radius:0 6px 6px 0; }
.md blockquote p { margin:.3rem 0; color:var(--fg); }
.md code { background:var(--bg-tabs); color:#ce9178; padding:.12rem .4rem; border-radius:3px; font-family:'JetBrains Mono',monospace; font-size:.85em; }
.md pre { background:var(--bg-tabs); border:1px solid var(--border); border-radius:8px; padding:1.15rem; margin:1.5rem 0; overflow-x:auto; }
.md pre code { background:none; padding:0; color:#d4d4d4; }
.md table { width:100%; border-collapse:collapse; margin:1.5rem 0; font-size:.88rem; }
.md th { text-align:left; padding:.55rem .8rem; border-bottom:2px solid var(--border-bright); color:var(--fg-bright); font-size:.78rem; text-transform:uppercase; letter-spacing:.8px; font-family:'JetBrains Mono',monospace; }
.md td { padding:.55rem .8rem; border-bottom:1px solid var(--border); color:var(--fg); }
.md tr:hover td { background:var(--sel); }
.md hr { border:none; border-top:1px dashed var(--border-bright); margin:2.25rem 0; }
.md .card-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:1rem; margin:1.5rem 0; }
.md .card { background:var(--bg-tabs); border:1px solid var(--border); border-radius:8px; padding:1.2rem; }
.md .card:hover { border-color:var(--border-bright); }
.md .card-meta { color:var(--md-orange); font-size:.7rem; text-transform:uppercase; letter-spacing:1.5px; font-family:'JetBrains Mono',monospace; }
.md .card-title { color:var(--fg-bright); font-weight:600; font-size:1rem; margin:.4rem 0 .5rem; }
.md .card-content { color:var(--fg); font-size:.86rem; margin-bottom:.7rem; }
.md .card-tech { color:var(--md-green); font-size:.76rem; font-family:'JetBrains Mono',monospace; }
/* images */
.md img { max-width:100%; border-radius:8px; cursor:zoom-in; }
/* status bar */
.status-bar {
    height:24px; background:var(--status); color:#fff; display:flex; align-items:center;
    padding:0 .75rem; gap:1.25rem; font-size:.72rem; font-family:'JetBrains Mono',monospace; flex-shrink:0;
}
.status-bar .sb-right { margin-left:auto; display:flex; gap:1.25rem; }
.status-bar .sb-item { cursor:default; white-space:nowrap; }
.status-bar .sb-item.clickable:hover { background:rgba(255,255,255,.15); }
/* loading */
.loading-pane { padding:3rem; color:var(--fg-dim); font-family:'JetBrains Mono',monospace; font-size:.85rem; }
/* image preview overlay (engine addition; reuses existing vars) */
.img-preview { position:fixed; inset:0; background:rgba(0,0,0,.82); display:flex; align-items:center; justify-content:center; cursor:zoom-out; z-index:1000; }
.img-preview-box { max-width:min(92vw,1200px); max-height:90vh; background:var(--bg-side); border:1px solid var(--border-bright); border-radius:8px; padding:1rem; display:flex; flex-direction:column; gap:.6rem; }
.img-preview-img { max-width:100%; max-height:78vh; object-fit:contain; border-radius:4px; }
.img-preview-caption { color:var(--fg-dim); font-family:'JetBrains Mono',monospace; font-size:.72rem; text-align:center; }
/* light theme */
body.light {
    --bg:#ffffff; --bg-side:#f3f3f3; --bg-tabs:#ececec; --bg-editor:#ffffff;
    --fg:#333; --fg-dim:#767677; --fg-bright:#111;
    --accent:#0066b8; --accent-dim:#e5effb; --border:#dcdcdc; --border-bright:#c8c8c8;
    --md-blue:#315a8a; --md-green:#387a1e; --md-orange:#b05a1d; --tab-active:#ffffff; --status:#0066b8;
    --sel:rgba(0,102,184,.09);
}
@media (max-width:820px) {
    .sidebar { width:52px; }
    .sidebar-header, .tree-folder span, .tree-file span, .sidebar-footer { display:none; }
    .tree-folder { justify-content:center; padding:.5rem 0; }
    .tree-folder .chev { display:none; }
    .tree-file { justify-content:center; padding-left:.4rem; }
    .tree-file.active::before { width:auto; height:2px; top:auto; left:0; right:0; }
    .code-area { padding:1.25rem 1.25rem 3rem; }
    .editor-layout { grid-template-columns:0 1fr; }
    .gutter { display:none; }
}
</style>
</head>
<body>
<div class="titlebar">
    <div class="win-dots"><span class="r"></span><span class="y"></span><span class="g"></span></div>
    <div class="title-text"><span class="file" id="title-file">index.md</span> — Kuantum Lab — Learning Path — Visual Studio Code</div>
    <button class="theme-btn" onclick="toggleTheme()" style="background:none;border:1px solid var(--border);border-radius:4px;color:inherit;font-size:.7rem;padding:.2rem .6rem;cursor:pointer;">🌓 theme</button>
</div>

<div class="workbench">
    <div class="sidebar">
        <div class="sidebar-header">Explorer</div>
        <div class="sidebar-tree">
            <div class="sidebar-files" id="tree-files">
                <div class="loading-pane">Loading tree…</div>
            </div>
        </div>
        <div class="sidebar-footer">
            <div class="row"><span id="sf-branch">kuantumlab</span><span id="sf-repo">dev</span></div>
            <div class="row"><span id="sf-root">learning-path</span><span id="sf-files">… files</span></div>
        </div>
    </div>

    <div class="main-area">
        <div class="tabs-bar" id="tabs-bar"></div>
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="editor-scroll" id="editor-scroll">
            <div class="editor-layout">
                <div class="gutter" id="gutter"></div>
                <div class="code-area"><div class="md" id="content"><div class="loading-pane">Loading…</div></div></div>
            </div>
        </div>
        <div class="status-bar">
            <span class="sb-item clickable" onclick="toggleTheme()">⎇ dev</span>
            <span class="sb-item" id="sb-errors">⚠ 0</span>
            <span class="sb-item" id="sb-cursor">Ln 1, Col 1</span>
            <span class="sb-item">Spaces: 2</span>
            <span class="sb-item">UTF-8</span>
            <span class="sb-item">LF</span>
            <div class="sb-right">
                <span class="sb-item">Markdown</span>
                <span class="sb-item" id="sb-lines">0 lines</span>
            </div>
        </div>
    </div>
</div>

<script src="viewer-engine/app.js"></script>
</body>
</html>
