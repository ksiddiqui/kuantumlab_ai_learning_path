<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220">
  <rect width="800" height="220" fill="#ffffff"/>
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <!-- Nodes -->
  <rect x="30" y="50" width="150" height="70" rx="10" fill="url(#grad1)" filter="url(#shadow)" stroke="#1e40af" stroke-width="1"/>
  <text x="105" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1e40af">PERCEIVE</text>
  <text x="105" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1e40af">See user request</text>
  <text x="105" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1e40af">and context</text>

  <rect x="225" y="50" width="150" height="70" rx="10" fill="url(#grad2)" filter="url(#shadow)" stroke="#5b21b6" stroke-width="1"/>
  <text x="300" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#5b21b6">PLAN</text>
  <text x="300" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b21b6">Decide what to do</text>
  <text x="300" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5b21b6">next</text>

  <rect x="420" y="50" width="150" y2="120" width="150" height="70" rx="10" fill="url(#grad3)" filter="url(#shadow)" stroke="#065f44" stroke-width="1"/>
  <text x="495" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#065f44">ACT</text>
  <text x="495" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#065f44">Call a tool</text>
  <text x="495" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#065f44">or take action</text>

  <rect x="620" y="50" width="150" height="70" rx="10" fill="url(#grad4)" filter="url(#shadow)" stroke="#92400e" stroke-width="1"/>
  <text x="695" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#92400e">OBSERVE</text>
  <text x="695" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#92400e">Read the tool</text>
  <text x="695" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#92400e">result</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
  </defs>
  <line x1="180" y1="85" x2="225" y2="85" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="375" y1="85" x2="420" y2="85" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="85" x2="620" y2="85" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Loop-back arrow -->
  <path d="M770 120 C 770 180, 60 180, 60 120" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#374151">Repeat until done</text>

  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1f2937">The AI Agent Loop</text>
  <text x="400" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b7280">perceive → plan → act → observe → repeat</text>
</svg>
