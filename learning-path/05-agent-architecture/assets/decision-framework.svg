<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#ffffff"/>
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1f2937">Custom Agent vs Skill vs Command</text>
  <text x="400" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6b7280">Decision Framework</text>

  <!-- Start -->
  <rect x="300" y="70" width="200" height="50" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="88" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#2563eb">Start Here</text>
  <text x="400" y="103" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e40af">Do you need to decide?</text>

  <line x1="400" y1="120" x2="400" y2="140" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Question 1 -->
  <rect x="250" y="140" width="300" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#92400e">Is this a one-off task?</text>
  <text x="400" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#92400e">Do it once, no reuse needed</text>

  <!-- YES → Command -->
  <line x1="400" y1="200" x2="550" y2="230" stroke="#10b981" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="480" y="215" font-family="system-ui, sans-serif" font-size="11" fill="#059669">yes</text>

  <rect x="530" y="210" width="150" height="50" rx="8" fill="#dcfce7" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="605" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#065f44">COMMAND</text>
  <text x="605" y="245" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#065f44">Direct instruction</text>

  <!-- NO → continue -->
  <line x1="400" y1="200" x2="400" y2="240" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="415" y="220" font-family="system-ui, sans-serif" font-size="11" fill="#374151">no</text>

  <!-- Question 2 -->
  <rect x="250" y="240" width="300" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="265" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#92400e">Will you reuse this behavior?</text>
  <text x="400" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#92400e">Same task, multiple times</text>

  <!-- YES → Skill -->
  <line x1="400" y1="300" x2="550" y2="330" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="480" y="315" font-family="system-ui, sans-serif" font-size="11" fill="#7c3aed">yes, same behavior</text>

  <rect x="530" y="330" width="150" height="50" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="605" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#5b21b6">SKILL</text>
  <text x="605" y="365" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5b21b6">Reusable config</text>

  <!-- NO → continue -->
  <line x1="400" y1="300" x2="400" y2="340" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="415" y="320" font-family="system-ui, sans-serif" font-size="11" fill="#374151">no, need variety</text>

  <!-- Question 3 -->
  <rect x="250" y="340" width="300" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="365" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#92400e">New persona or tool set?</text>
  <text x="400" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#92400e">Different role or capabilities</text>

  <line x1="400" y1="400" x2="400" y2="420" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="415" y="410" font-family="system-ui, sans-serif" font-size="11" fill="#374151">yes</text>

  <!-- Result: Custom Agent -->
  <rect x="275" y="420" width="250" height="60" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="445" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#991b1b">CUSTOM AGENT</text>
  <text x="400" y="460" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#991b1b">Custom persona + tools + workflow</text>

  <!-- Legend -->
  <rect x="30" y="510" width="740" height="70" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="400" y="528" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#374151">Quick Reference</text>
  <text x="400" y="545" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">Command = direct prompt | Skill = reusable instructions/MCP | Custom Agent = unique persona + tool set via OMP</text>
  <text x="400" y="560" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">Built with OpenCode in Section 1, Extended with OMP in Section 7</text>

</svg>
